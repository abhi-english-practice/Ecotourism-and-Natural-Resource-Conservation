<script>
'use strict';
const DATA=JSON.parse(document.getElementById('reading-data').textContent), S=DATA.sentences, P=DATA.paragraphs, C=DATA.phrases;
const $=id=>document.getElementById(id), audio=$('audio');
let tab='home',viOn=false,phrasesOn=true,sIdx=0,cIdx=0,order=C.map((_,i)=>i),flipped=false,reviewOnly=false;
let selected=S.map(()=>[]),banks=S.map((s)=>shuffled(s.chunks.map((_,i)=>i))),done=new Set(),feedback=S.map(()=>''),answerShown=S.map(()=>false),viHintShown=true;
let marks=[],history=[],pendingSelection=[],reviewStates=C.map(()=>''),playToken=0,segment=null,raf=0,internalSeek=false;
const esc=x=>String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
function shuffled(a){let b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}if(b.length>2&&b.every((x,i)=>x===a[i])) b.reverse();return b}
function toast(t){let e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>e.style.display='none',2600)}
function showTab(which){cancelAudio();tab=which;for(let key of ['home','sentence','cards']){$(key).hidden=key!==which;$('nav-'+key).classList.toggle('active',key===which)}if(which==='sentence')renderSentence();if(which==='cards')renderCard();window.scrollTo({top:0,behavior:'instant'})}
function setVi(v){viOn=v;$('toggleVi').textContent=v?'VI ON':'VI OFF';renderHome()}
function setPhrases(v){phrasesOn=v;$('toggleColloc').textContent=v?'Key phrases ON':'Key phrases OFF';renderHome()}
function searchPhrases(text){let matches=[];for(let c of C){let q=c.match.toLowerCase(),idx=0;while((idx=text.toLowerCase().indexOf(q,idx))!==-1){matches.push({a:idx,b:idx+q.length,id:c.id});idx+=q.length}}return matches}
function markText(text,si){const cc=phrasesOn?searchPhrases(text):[];let mm=marks.filter(x=>x.si===si),bounds=new Set([0,text.length]);for(const v of [...cc,...mm]){bounds.add(v.a);bounds.add(v.b)}let b=[...bounds].filter(x=>x>=0&&x<=text.length).sort((x,y)=>x-y);return b.slice(0,-1).map((a,k)=>{const e=b[k+1],mid=(a+e)/2,coll=cc.find(x=>mid>=x.a&&mid<x.b),mark=mm.filter(x=>mid>=x.a&&mid<x.b).at(-1),classes=[];if(coll)classes.push('colloc');if(mark)classes.push('color-'+mark.color);const attrs=coll?' data-card="'+coll.id+'" tabindex="0" role="button" title="Open review card"':'';return '<span'+(classes.length?' class="'+classes.join(' ')+'"':'')+attrs+'>'+esc(text.slice(a,e))+'</span>'}).join('')}
function renderHome(){const el=$('home');let h='<div class="line-head"><h2>Can Ecotourism Help Protect Nature?</h2><span class="meta">'+P.length+' paragraphs · '+S.length+' sentences · '+C.length+' key phrases</span></div>';
h+='<div class="toolbar"><span>Select text:</span><button class="btn small" data-paint="yellow">Yellow</button><button class="btn small" data-paint="green">Green</button><button class="btn small" data-paint="pink">Pink</button><button class="btn small" data-paint="erase">Erase</button><button class="btn small" data-paint="undo">Undo</button><button class="btn small" data-paint="clear">Clear colours</button></div><div class="reading" id="passage">';
for(let pi=0;pi<P.length;pi++){let ss=S.filter(s=>s.p===pi+1);h+='<p data-p="'+pi+'">'+ss.map(s=>'<span class="sentence-run" data-si="'+s.id+'">'+markText(s.text,s.id)+'</span>').join(' ')+'</p>';if(viOn)h+='<div class="para-vi" lang="vi">'+esc(ss.map(s=>s.vi).join(' '))+'</div>'}
h+='</div>';let scroll=window.scrollY;el.innerHTML=h;updateAudioHighlight();if(tab==='home'&&Math.abs(window.scrollY-scroll)>30)window.scrollTo(0,scroll)}
function getHomeSelection(){const sel=window.getSelection();if(!sel||sel.isCollapsed||!sel.toString().trim())return [];let r=sel.getRangeAt(0),results=[];for(let el of document.querySelectorAll('#passage .sentence-run')){if(!r.intersectsNode(el))continue;let range=document.createRange();range.selectNodeContents(el);const len=el.textContent.length;let aRange=range.cloneRange(),bRange=range.cloneRange();try{aRange.setEnd(r.startContainer,r.startOffset);bRange.setEnd(r.endContainer,r.endOffset)}catch(e){continue}let a=Math.min(len,aRange.toString().length),b=Math.min(len,bRange.toString().length);if(a<b)results.push({si:Number(el.dataset.si),a,b})}return results}
function paint(color){if(color==='undo'){if(history.length){marks=history.pop();renderHome()}return}if(color==='clear'){history.push(structuredClone(marks));marks=[];renderHome();return}
let area=getHomeSelection();if(!area.length)area=pendingSelection;if(!area.length){toast('Select some words in the reading first.');return}
history.push(structuredClone(marks));for(let q of area){if(color==='erase'){marks=marks.flatMap(m=>{if(m.si!==q.si||m.b<=q.a||m.a>=q.b)return [m];let parts=[];if(m.a<q.a)parts.push({...m,b:q.a});if(m.b>q.b)parts.push({...m,a:q.b});return parts})}else{marks=marks.flatMap(m=>{if(m.si!==q.si||m.b<=q.a||m.a>=q.b)return [m];let parts=[];if(m.a<q.a)parts.push({...m,b:q.a});if(m.b>q.b)parts.push({...m,a:q.b});return parts});marks.push({...q,color})}}pendingSelection=[];window.getSelection()?.removeAllRanges();renderHome()}
function renderSentence(){const s=S[sIdx],num=S.length,parts=s.chunks,chosen=selected[sIdx],bank=banks[sIdx],f=feedback[sIdx];let opts=S.map(x=>'<option value="'+x.id+'"'+(x.id===sIdx?' selected':'')+'>Sentence '+(x.id+1)+' · Paragraph '+x.p+'</option>').join('');let h='<div class="builder"><div class="overline">SENTENCE BUILDER · Paragraph '+s.p+'</div><div class="builder-top"><h2>Sentence '+(sIdx+1)+' / '+num+'</h2><label class="detail-tools" for="goSentence">Go to sentence <select id="goSentence">'+opts+'</select></label></div>';
h+='<div class="progress-track"><div class="progress-fill" style="width:'+(100*done.size/num)+'%"></div></div><section class="hint-box"><div class="line-head"><h3>VIETNAMESE HINT</h3><button class="btn small" id="toggleHint">'+(viHintShown?'Hide':'Show')+'</button></div>'+(viHintShown?'<p lang="vi">'+esc(s.vi)+'</p>':'<div class="hidden-hint">Vietnamese hint is hidden.</div>')+'</section>';
h+='<div class="listen-row"><button class="btn primary" id="listenSentence">▶ Listen to sentence</button><button class="btn" id="stopSentence">■ Stop</button><span class="muted">Listen once, then build the sentence.</span></div>';
h+='<div class="build-slot" id="buildSlot">'+(chosen.length?chosen.map(i=>'<button class="chunk placed" data-remove="'+i+'">'+esc(parts[i])+'</button>').join(' '):'<div class="placeholder">Tap the chunks to build the original sentence.</div>')+'</div>';
h+='<div class="chunk-bank" id="chunkBank">'+bank.filter(i=>!chosen.includes(i)).map(i=>'<button class="chunk" data-add="'+i+'">'+esc(parts[i])+'</button>').join('')+'</div>';
h+='<div class="actions"><button class="btn primary" id="checkSentence">Check</button><button class="btn" id="hintSentence">Hint</button><button class="btn" id="clearSentence">Clear</button><button class="btn" id="answerSentence">Show Answer</button></div>';
h+='<div class="feedback '+(f.startsWith('Correct')?'ok':'err')+'" role="status">'+esc(f)+'</div>';
if(answerShown[sIdx])h+='<div class="answer">'+esc(s.text)+'</div>';
h+='<div class="pager"><button class="btn" id="prevSentence" '+(sIdx===0?'disabled':'')+'>← Prev</button><span class="progress">'+done.size+' / '+num+' complete</span><button class="btn" id="nextSentence" '+(sIdx===num-1?'disabled':'')+'>Next →</button></div></div>';$('sentence').innerHTML=h}
function goSentence(i){cancelAudio();sIdx=Math.max(0,Math.min(S.length-1,Number(i)));viHintShown=true;renderSentence()}
function addChunk(i){if(selected[sIdx].includes(i))return;selected[sIdx].push(i);feedback[sIdx]='';answerShown[sIdx]=false;renderSentence()}
function removeChunk(i){selected[sIdx]=selected[sIdx].filter(x=>x!==i);feedback[sIdx]='';answerShown[sIdx]=false;renderSentence()}
function checkSentence(){let k=selected[sIdx],n=S[sIdx].chunks.length;if(k.length===n&&k.every((v,i)=>v===i)){done.add(sIdx);feedback[sIdx]='Correct! You have restored the original sentence.'}else if(!k.length){feedback[sIdx]='Tap the chunks to build the sentence first.'}else{feedback[sIdx]='Not yet in the original order. Try again.'}renderSentence()}
function nextHint(){let arr=selected[sIdx],target=arr.length;if(arr.every((v,i)=>v===i)&&target<S[sIdx].chunks.length)feedback[sIdx]='Next chunk: '+S[sIdx].chunks[target];else feedback[sIdx]='Hint: Start again from the first chunk and follow the original order.';renderSentence()}
function clearSentence(){selected[sIdx]=[];banks[sIdx]=shuffled(S[sIdx].chunks.map((_,i)=>i));answerShown[sIdx]=false;feedback[sIdx]='';renderSentence()}
function activeCardList(){return reviewOnly?order.filter(i=>reviewStates[i]==='review'):order}
function currentCardId(){let ids=activeCardList();if(!ids.length)return null;cIdx=Math.min(Math.max(0,cIdx),ids.length-1);return ids[cIdx]}
function renderCard(){let ids=activeCardList(),id=currentCardId();let h='<div class="line-head"><h2>Review Cards</h2><span class="meta">'+C.length+' phrases · '+C.filter((x,i)=>reviewStates[i]==='remembered').length+' remembered</span></div>';
h+='<div class="card-tools"><button class="btn small" id="shuffleCards">Shuffle</button><button class="btn small" id="reviewFilter">'+(reviewOnly?'Show all cards':'Needs review only')+'</button><button class="btn small" id="resetCards">Reset cards</button></div>';
if(id===null){h+='<div class="flash">No cards are marked “Needs review”. <button class="btn" id="showAllCards">Show all cards</button></div>';$('cards').innerHTML=h;return}
let c=C[id],s=S[c.sentence];h+='<div class="overline">CARD '+(cIdx+1)+' / '+ids.length+'</div><div class="flash"><div class="kind">'+esc(c.kind)+'</div><div class="phrase">'+esc(c.text)+'</div>';
if(flipped){let start=s.text.toLowerCase().indexOf(c.match.toLowerCase());let example=start>=0?esc(s.text.slice(0,start))+'<strong>'+esc(s.text.slice(start,start+c.match.length))+'</strong>'+esc(s.text.slice(start+c.match.length)):esc(s.text);h+='<div class="flash-detail"><p class="ipa">'+esc(c.ipa)+'</p><div class="meaning" lang="vi">'+esc(c.vi)+'</div><div class="example">'+example+'</div><p class="translate" lang="vi">'+esc(s.vi)+'</p><p class="tip">From Sentence '+(s.id+1)+' · Paragraph '+s.p+'</p><button class="btn small" id="jumpSentence">Open source sentence →</button></div>'}
h+='</div><div class="card-actions"><button class="btn" id="prevCard" '+(cIdx===0?'disabled':'')+'>← Previous</button><button class="btn primary" id="flipCard">'+(flipped?'Hide answer':'Show answer')+'</button><button class="btn" id="nextCard" '+(cIdx===ids.length-1?'disabled':'')+'>Next →</button></div>';
h+='<div class="card-actions" style="margin-top:17px"><button class="btn" id="listenCard">▶ Listen to sentence</button><button class="btn" id="stopCard">■ Stop</button><button class="btn '+(reviewStates[id]==='review'?'selected-review':'')+'" id="markReview">Needs review</button><button class="btn '+(reviewStates[id]==='remembered'?'studied':'')+'" id="markRemembered">Remembered</button></div>';
$('cards').innerHTML=h}
function cardMove(diff){cancelAudio();let ids=activeCardList();cIdx=Math.max(0,Math.min(ids.length-1,cIdx+diff));flipped=false;renderCard()}
function pickCard(id){cancelAudio();reviewOnly=false;cIdx=order.indexOf(id);flipped=false;showTab('cards')}
function updateAudioHighlight(){document.querySelectorAll('.sentence-run.audio-active').forEach(e=>e.classList.remove('audio-active'));if(audio.paused)return;let t=audio.currentTime,idx=S.findIndex(s=>t>=s.start&&t<s.end);if(idx>=0)document.querySelectorAll('.sentence-run[data-si="'+idx+'"]').forEach(e=>e.classList.add('audio-active'))}
function stopAtEnd(){if(!audio.paused){if(segment&&audio.currentTime>=segment.end-0.025){const last=segment.end;audio.pause();segment=null;audio.currentTime=last}updateAudioHighlight();raf=requestAnimationFrame(stopAtEnd)}else{updateAudioHighlight();raf=0}}
function cancelAudio(){playToken++;segment=null;internalSeek=false;audio.pause();if(raf){cancelAnimationFrame(raf);raf=0}updateAudioHighlight()}
async function playSentence(i){cancelAudio();const tk=playToken;const s=S[i];if(!audio.readyState){try{await new Promise((resolve,reject)=>{if(audio.readyState)return resolve();const ok=()=>{clean();resolve()},err=()=>{clean();reject(new Error('Audio unavailable'))};const clean=()=>{audio.removeEventListener('loadedmetadata',ok);audio.removeEventListener('error',err)};audio.addEventListener('loadedmetadata',ok);audio.addEventListener('error',err);audio.load()})}catch(e){if(tk===playToken)toast('Could not load reading.mp3');return}}
if(tk!==playToken)return;try{internalSeek=true;audio.currentTime=s.start;segment={id:i,end:s.end};audio.playbackRate=Number($('speed').value);await audio.play();if(tk!==playToken){audio.pause();return}if(!raf)raf=requestAnimationFrame(stopAtEnd)}catch(e){if(tk===playToken)toast('Audio playback failed. Check reading.mp3')}}
function resetAll(){cancelAudio();viOn=false;phrasesOn=true;selected=S.map(()=>[]);banks=S.map(s=>shuffled(s.chunks.map((_,i)=>i)));done.clear();feedback=S.map(()=>'');answerShown=S.map(()=>false);viHintShown=true;marks=[];history=[];pendingSelection=[];reviewStates=C.map(()=>'');order=C.map((_,i)=>i);cIdx=0;sIdx=0;flipped=false;reviewOnly=false;setVi(false);setPhrases(true);showTab('home')}
// Single shared audio element; navigating any learning module immediately stops the previous sentence.
audio.addEventListener('timeupdate',updateAudioHighlight);audio.addEventListener('pause',updateAudioHighlight);audio.addEventListener('play',()=>{if(!raf)raf=requestAnimationFrame(stopAtEnd)});audio.addEventListener('ended',()=>{segment=null;updateAudioHighlight()});
audio.addEventListener('seeking',()=>{if(segment&&!internalSeek)segment=null});audio.addEventListener('seeked',()=>{internalSeek=false});
$('speed').addEventListener('change',e=>audio.playbackRate=Number(e.target.value));$('stopAudio').addEventListener('click',cancelAudio);$('toggleVi').addEventListener('click',()=>setVi(!viOn));$('toggleColloc').addEventListener('click',()=>setPhrases(!phrasesOn));$('resetAll').addEventListener('click',resetAll);
document.querySelectorAll('[data-tab]').forEach(e=>e.addEventListener('click',()=>showTab(e.dataset.tab)));
document.addEventListener('selectionchange',()=>{if(tab==='home'&&window.getSelection()?.toString().trim()&&$('passage')?.contains(window.getSelection().anchorNode)){let q=getHomeSelection();if(q.length)pendingSelection=q}});
document.addEventListener('click',e=>{let t=e.target.closest('button,[data-card]');if(!t)return;

switch(t.id){case 'toggleHint':viHintShown=!viHintShown;renderSentence();break;case 'listenSentence':playSentence(sIdx);break;case 'stopSentence':cancelAudio();break;case 'checkSentence':checkSentence();break;case 'hintSentence':nextHint();break;case 'clearSentence':clearSentence();break;case 'answerSentence':answerShown[sIdx]=!answerShown[sIdx];renderSentence();break;case 'prevSentence':goSentence(sIdx-1);break;case 'nextSentence':goSentence(sIdx+1);break;
case 'flipCard':flipped=!flipped;renderCard();break;case 'prevCard':cardMove(-1);break;case 'nextCard':cardMove(1);break;case 'listenCard':{let id=currentCardId();if(id!==null)playSentence(C[id].sentence);break}case 'stopCard':cancelAudio();break;case 'jumpSentence':{let id=currentCardId();if(id!==null){sIdx=C[id].sentence;showTab('sentence')}break}
case 'markReview':case 'markRemembered':{let id=currentCardId();if(id!==null){reviewStates[id]=t.id==='markReview'?'review':'remembered';cancelAudio();renderCard()}break}
case 'shuffleCards':{let id=currentCardId();order=shuffled(order);cIdx=Math.max(0,activeCardList().indexOf(id));flipped=false;cancelAudio();renderCard();break}
case 'reviewFilter':reviewOnly=!reviewOnly;cIdx=0;flipped=false;cancelAudio();renderCard();break;
case 'showAllCards':reviewOnly=false;cIdx=0;renderCard();break;
case 'resetCards':reviewStates=C.map(()=>'');reviewOnly=false;cIdx=0;order=C.map((_,i)=>i);flipped=false;cancelAudio();renderCard();break;
}});
document.addEventListener('change',e=>{if(e.target.id==='goSentence')goSentence(e.target.value)});
document.addEventListener('keydown',e=>{let a=e.target.closest('[data-card]');if(a&&(e.key==='Enter'||e.key===' ')){e.preventDefault();pickCard(Number(a.dataset.card))}});
